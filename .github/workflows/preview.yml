name: Branch Preview

on:
  push:
    branches:
      - "claude/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Derive preview URL
        id: url
        run: |
          # Replace / and non-alphanumeric chars with hyphens, lowercase
          SLUG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g')
          # Surge subdomain max 63 chars; prefix with site name for uniqueness
          SUBDOMAIN="alphang-${SLUG}"
          SUBDOMAIN="${SUBDOMAIN:0:63}"
          echo "url=https://${SUBDOMAIN}.surge.sh" >> "$GITHUB_OUTPUT"
          echo "subdomain=${SUBDOMAIN}.surge.sh"  >> "$GITHUB_OUTPUT"

      - name: Deploy to Surge.sh
        run: |
          npm install --global surge
          surge ./_site "${{ steps.url.outputs.subdomain }}" --token "${{ secrets.SURGE_TOKEN }}"
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.url.outputs.url }}';
            const body = `## Preview deployment\n\n**${url}**\n\nBuilt from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## Preview deployment'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
